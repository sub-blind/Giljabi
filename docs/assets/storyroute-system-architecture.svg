<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="900" viewBox="0 0 1500 900" role="img" aria-labelledby="title desc">
  <title id="title">스토리루트 시스템 구성도</title>
  <desc id="desc">브라우저, Vercel Next.js, Render FastAPI, PostgreSQL과 외부 관광·AI·카카오·지도 서비스의 연결 구조</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.12"/></filter>
    <style>
      .title{font:700 30px Pretendard,"Noto Sans KR",sans-serif;fill:#0f172a}.sub{font:400 15px Pretendard,"Noto Sans KR",sans-serif;fill:#64748b}
      .zone{fill:#f8fafc;stroke:#cbd5e1;stroke-width:2;stroke-dasharray:8 7}.zone-title{font:700 17px Pretendard,"Noto Sans KR",sans-serif;fill:#334155}
      .box{filter:url(#shadow);stroke-width:2}.head{font:700 18px Pretendard,"Noto Sans KR",sans-serif;fill:#fff}.body{font:500 14px Pretendard,"Noto Sans KR",sans-serif;fill:#26364a}.small{font:400 13px Pretendard,"Noto Sans KR",sans-serif;fill:#526276}
      .line{fill:none;stroke:#64748b;stroke-width:2.5;marker-end:url(#arrow)}.dash{stroke-dasharray:7 6}.label{font:600 12px Pretendard,"Noto Sans KR",sans-serif;fill:#475569}
    </style>
  </defs>
  <rect width="1500" height="900" fill="#fff"/>
  <text class="title" x="58" y="58">스토리루트 시스템 구성도</text>
  <text class="sub" x="58" y="86">2026-09-21 운영 확인 기준: 화면은 Vercel, API는 Render에서 실행하며 비밀키와 외부 API 호출은 백엔드에 둡니다.</text>

  <rect class="zone" x="45" y="125" width="330" height="565" rx="24"/><text class="zone-title" x="70" y="160">사용자 브라우저</text>
  <g class="box"><rect x="75" y="190" width="270" height="132" rx="18" fill="#e8f0ff" stroke="#5b7ce2"/><rect x="75" y="190" width="270" height="42" rx="18" fill="#4169dc"/><path d="M75 214h270v18H75z" fill="#4169dc"/><text class="head" x="95" y="218">Next.js React UI</text><text class="body" x="95" y="263">지도 · 문장 · 사진 탐색</text><text class="small" x="95" y="289">장소 선택 · 코스 · 여행 기록</text></g>
  <g class="box"><rect x="75" y="360" width="270" height="120" rx="18" fill="#eefbf6" stroke="#3f8f75"/><rect x="75" y="360" width="270" height="42" rx="18" fill="#2d7663"/><path d="M75 384h270v18H75z" fill="#2d7663"/><text class="head" x="95" y="388">브라우저 저장소</text><text class="body" x="95" y="434">비회원 최근 코스</text><text class="small" x="95" y="458">방문 완료 · 장소별 메모</text></g>
  <g class="box"><rect x="75" y="520" width="270" height="115" rx="18" fill="#fff8e8" stroke="#d1a451"/><rect x="75" y="520" width="270" height="42" rx="18" fill="#b98528"/><path d="M75 544h270v18H75z" fill="#b98528"/><text class="head" x="95" y="548">Leaflet · 외부 화면</text><text class="body" x="95" y="594">OpenStreetMap 타일</text><text class="small" x="95" y="618">카카오맵 길찾기 · 원본 미디어</text></g>

  <rect class="zone" x="425" y="125" width="260" height="565" rx="24"/><text class="zone-title" x="450" y="160">Vercel</text>
  <g class="box"><rect x="455" y="248" width="200" height="185" rx="18" fill="#f4f4f5" stroke="#52525b"/><rect x="455" y="248" width="200" height="44" rx="18" fill="#27272a"/><path d="M455 273h200v19H455z" fill="#27272a"/><text class="head" x="480" y="277">Next.js</text><text class="body" x="480" y="326">정적 화면 배포</text><text class="small" x="480" y="355">day-trip · auth</text><text class="small" x="480" y="378">account API rewrite</text><text class="small" x="480" y="405">브라우저는 동일 출처만 호출</text></g>

  <rect class="zone" x="735" y="125" width="360" height="565" rx="24"/><text class="zone-title" x="760" y="160">Render</text>
  <g class="box"><rect x="765" y="190" width="300" height="145" rx="18" fill="#ecf4ff" stroke="#3b82c4"/><rect x="765" y="190" width="300" height="44" rx="18" fill="#2774ad"/><path d="M765 215h300v19H765z" fill="#2774ad"/><text class="head" x="790" y="219">FastAPI 진입점</text><text class="body" x="790" y="274">입력 검증 · 요청 제한</text><text class="small" x="790" y="301">취소·시간 제한 · 오류 응답 통일</text></g>
  <g class="box"><rect x="765" y="365" width="300" height="125" rx="18" fill="#f1edff" stroke="#8065c7"/><rect x="765" y="365" width="300" height="42" rx="18" fill="#6846ad"/><path d="M765 389h300v18H765z" fill="#6846ad"/><text class="head" x="790" y="393">여행 서비스</text><text class="body" x="790" y="445">실제 장소 재검증 · 콘텐츠 조합</text><text class="small" x="790" y="468">문장 해석 · 자동차 구간 경로</text></g>
  <g class="box"><rect x="765" y="520" width="300" height="120" rx="18" fill="#fff0f2" stroke="#c55b72"/><rect x="765" y="520" width="300" height="42" rx="18" fill="#a83e59"/><path d="M765 544h300v18H765z" fill="#a83e59"/><text class="head" x="790" y="548">인증 · 계정 코스</text><text class="body" x="790" y="594">카카오 OAuth · 세션</text><text class="small" x="790" y="618">회원 코스 저장 · 조회 · 삭제</text></g>

  <rect class="zone" x="1145" y="125" width="310" height="700" rx="24"/><text class="zone-title" x="1170" y="160">데이터·외부 서비스</text>
  <g class="box"><rect x="1175" y="190" width="250" height="105" rx="18" fill="#e9fbf2" stroke="#3d966b"/><text class="body" x="1200" y="228">PostgreSQL</text><text class="small" x="1200" y="257">사용자 · 세션 · 계정 코스</text></g>
  <g class="box"><rect x="1175" y="325" width="250" height="120" rx="18" fill="#eef7ff" stroke="#4e87b6"/><text class="body" x="1200" y="363">한국관광공사 TourAPI</text><text class="small" x="1200" y="392">관광지 · 사진 · 오디 · 연관</text><text class="small" x="1200" y="416">무장애 여행정보</text></g>
  <g class="box"><rect x="1175" y="475" width="250" height="105" rx="18" fill="#f5f0ff" stroke="#8c68c4"/><text class="body" x="1200" y="513">OpenAI Responses API</text><text class="small" x="1200" y="542">선택적 해석 · 근거 선택</text></g>
  <g class="box"><rect x="1175" y="610" width="250" height="105" rx="18" fill="#fff6dc" stroke="#c39224"/><text class="body" x="1200" y="648">카카오</text><text class="small" x="1200" y="677">OAuth · 자동차 경로 · 길찾기</text></g>
  <g class="box"><rect x="1175" y="745" width="250" height="55" rx="18" fill="#f1f5f9" stroke="#8190a3"/><text class="body" x="1200" y="779">OpenStreetMap 타일</text></g>

  <path class="line" d="M345 256H455"/><text class="label" x="371" y="243">HTTPS</text>
  <path class="line" d="M655 340H765"/><text class="label" x="672" y="326">API rewrite</text>
  <path class="line" d="M915 335V365"/>
  <path class="line" d="M915 335V520"/>
  <path class="line" d="M1065 580H1175V243"/><text class="label" x="1080" y="568">SQL</text>
  <path class="line" d="M1065 421H1175V385"/>
  <path class="line dash" d="M1065 435H1135V527H1175"/><text class="label" x="1080" y="515">선택</text>
  <path class="line" d="M1065 447H1120V662H1175"/>
  <path class="line" d="M345 578H400V772H1175"/><text class="label" x="473" y="759">지도 타일 · 외부 길찾기 · 원본 미디어</text>
  <path class="line" d="M210 322V360"/>
  <text class="sub" x="58" y="860">경계 원칙: 외부 API 비밀키는 브라우저에 두지 않으며, 저장한 장소 ID는 코스를 열 때 TourAPI로 다시 확인합니다.</text>
</svg>
